<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    var path = window.location.pathname + window.location.search;
    var base = "/isaac-vitae/";
    // Only prepend base if not already present
    if (path.startsWith(base)) {
      window.location.href = path;
    } else {
      window.location.href = base + path.replace(/^\//, '');
    }
  </script>
</head>
<body>
  <p>Redirecting to <a href="/isaac-vitae/">home</a>...</p>
</body>
</html>
