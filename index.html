/* Critical CSS — above-the-fold preload (fonts + tokens + body baseline) */
@font-face{font-family:'Libre Caslon Display';font-display:swap;src:local('Libre Caslon Display')}
@font-face{font-family:'Quicksand';font-display:swap;src:local('Quicksand')}
@font-face{font-family:'Fira Code';font-display:swap;src:local('Fira Code')}
@font-face{font-family:'Playfair Display';font-display:swap;src:local('Playfair Display')}
@font-face{font-family:'Cinzel Decorative';font-display:swap;src:local('Cinzel Decorative')}
:root{--color-bg:#1d2021;--color-bg-deep:#282828;--color-bg-card:#1d2021;--color-bg-elevated:#32302f;--color-text:#ebdbb2;--color-text-2:#d5c4a1;--color-text-3:#b8aa95;--color-accent:#fe8019;--color-accent-light:#ffb347;--color-accent-dark:#e67300;--color-accent-peach:#ffcc99;--color-border:#504945;--color-border-2:#665c54;--color-border-accent:rgba(254,128,25,.30);--font-serif:'Libre Caslon Display',Georgia,serif;--font-sans:'Quicksand',ui-sans-serif,system-ui,sans-serif;--font-mono:'Fira Code','Courier New',monospace;--font-menu:'Playfair Display',Georgia,serif;--font-display:'Cinzel Decorative',Georgia,serif;--radius-lg:8px}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--color-bg);color:var(--color-text);font-family:var(--font-sans);line-height:1.65;letter-spacing:.01em}
body{margin:0;overflow-x:hidden;-webkit-font-smoothing:antialiased;background:var(--color-bg);color:var(--color-text)}
.font-serif{font-family:var(--font-serif)}
.font-sans{font-family:var(--font-sans)}
.font-mono{font-family:var(--font-mono)}
.font-display{font-family:var(--font-display)}
.font-menu{font-family:var(--font-menu)}
</style>
